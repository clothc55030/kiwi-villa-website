    <script>
        // 房型短網址備援（正常由 _redirects 處理，例如 /205 -> /rooms#room-205）
        (function () {
            var m = window.location.pathname.match(/^\/(201|203|205|301|302|303|305|306|307)\/?$/);
            if (m) {
                var map = { '302': '301', '306': '305', '307': '305' };
                window.location.replace('/rooms#room-' + (map[m[1]] || m[1]));
            }
        })();
    </script>
