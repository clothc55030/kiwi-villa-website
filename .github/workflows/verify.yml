name: Verify Site Integrity

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 完整歷史：檢查 sitemap.xml 的 lastmod 有沒有落後頁面最後一次修改

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run site integrity verification
        run: python tools/verify_site_integrity.py
